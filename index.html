<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SorghumIntel - Inteligência de Mercado</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#f4faff", primary: "#0d631b", "surface-container-lowest": "#ffffff",
            "outline-variant": "#bfcaba", "on-surface": "#0d1e25", "on-surface-variant": "#40493d",
            "surface-variant": "#d4e5ef", "secondary-container": "#f89c00"
          },
          fontFamily: { "body-md": ["Inter"], "data-mono": ["Inter"], "title-md": ["Inter"], "label-sm": ["Inter"] }
        }
      }
    }
  </script>
  <style>
    body { background-color: theme('colors.background'); color: theme('colors.on-background'); -webkit-font-smoothing: antialiased; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .badge-regulatório { background-color: #334155; color: white; }
    .badge-ciência-técnico { background-color: #e0f2fe; color: #0369a1; }
    .badge-mercado { background-color: #0d631b; color: white; }
    .badge-comercial { background-color: #fef3c7; color: #92400e; }
    .badge-evento { background-color: #059669; color: white; }
  </style>
</head>
<body class="font-body-md bg-background pb-24 md:pb-0 pt-16">

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white border-b border-outline-variant shadow-sm">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-2xl">agriculture</span>
      <h1 class="text-xl font-bold text-primary tracking-tight">SorghumIntel</h1>
    </div>
    <div class="flex flex-col items-end">
      <button onclick="carregarDadosIniciais(true)" class="material-symbols-outlined text-primary hover:bg-emerald-50 rounded-full transition-colors" title="Forçar Atualização">refresh</button>
      <span id="sync-info" class="text-[9px] text-gray-400 font-semibold mt-0.5"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Banner de Erro/Offline -->
    <div id="offline-banner" class="hidden mb-4 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-base">cloud_off</span> 
      <span id="offline-text">Exibindo última sincronização disponível.</span>
    </div>

    <!-- Barra de Busca -->
    <div class="mb-6 relative">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">search</span>
      <input id="search-input" class="w-full pl-12 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:outline-none focus:border-primary shadow-sm text-sm" placeholder="Buscar no SorghumIntel..." type="text">
    </div>

    <!-- Navegação de Abas -->
    <div class="overflow-x-auto no-scrollbar mb-8">
      <div class="flex space-x-2" id="nav-buttons">
        <button data-tab="ResumoSemanal" class="px-4 py-2 bg-primary text-white font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1.5 shadow-sm active-tab">
          <span class="material-symbols-outlined text-[18px]">auto_stories</span> Resumo Semanal
        </button>
        <button data-tab="Tudo" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Tudo</button>
        <button data-tab="Regulatório" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Regulatório</button>
        <button data-tab="Ciência/Técnico" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Ciência/Técnico</button>
        <button data-tab="Mercado" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Mercado</button>
        <button data-tab="Comercial" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Comercial</button>
        <button data-tab="Eventos" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Eventos</button>
        <button data-tab="Cotacao" class="px-4 py-2 bg-white border border-emerald-600 text-emerald-800 font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1">
          <span class="material-symbols-outlined text-[18px]">payments</span> Cotação
        </button>
      </div>
    </div>

    <!-- Container Principal Dinâmico -->
    <div id="main-content-container">
      <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz-xQ31zO2zy5slgOlp-fWrWBw47xjwu017Oh9YLMjxQ18bilqjCOdOcWMEoE7shFoEhg/exec";
    let bancoDados = { noticias: [], eventos: [], precos: [], resumosSemanais: [] };
    let abaAtual = "ResumoSemanal";
    let indexSemanaSelecionada = 0;

    function getBadgeInfo(cat) {
      if(!cat) return { cls: "bg-gray-700 text-white", icn: "article", tag: "Geral" };
      const c = cat.toLowerCase();
      if (c.includes("regulat")) return { cls: "bg-slate-700 text-white", icn: "policy", tag: "Regulatório" };
      if (c.includes("ciência") || c.includes("tecnico")) return { cls: "bg-sky-700 text-white", icn: "biotech", tag: "Ciência/Técnico" };
      if (c.includes("mercado")) return { cls: "bg-emerald-800 text-white", icn: "monitoring", tag: "Mercado" };
      if (c.includes("comercial")) return { cls: "bg-indigo-700 text-white", icn: "domain", tag: "Comercial" };
      if (c.includes("evento")) return { cls: "bg-emerald-600 text-white", icn: "event", tag: "Eventos" };
      return { cls: "bg-gray-700 text-white", icn: "article", tag: "Geral" };
    }

    function formatarMoedaBR(valor) {
      if (valor === null || valor === undefined || valor === "") return null;
      const num = typeof valor === 'number' ? valor : parseFloat(String(valor).replace(',', '.'));
      if (isNaN(num)) return null;
      return "R$ " + num.toFixed(2).replace('.', ',');
    }

    function formatarDataVisual(dataInput) {
      if (!dataInput) return null;
      const str = String(dataInput).trim();
      if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
        const partes = str.split(' ')[0].split('/');
        return `${partes[0].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[2]}`;
      }
      if (str.includes('-')) {
        const partesData = str.split('T')[0].split('-');
        if (partesData.length === 3 && partesData[0].length === 4) {
          return `${partesData[2].padStart(2, '0')}/${partesData[1].padStart(2, '0')}/${partesData[0]}`;
        }
      }
      return str;
    }

    function parseDataParaTimestamp(dataStr) {
      if (!dataStr) return 0;
      const formatada = formatarDataVisual(dataStr);
      if (formatada && formatada.includes('/')) {
        const partes = formatada.split('/');
        if (partes.length === 3) return new Date(partes[2], partes[1] - 1, partes[0]).getTime();
      }
      return new Date(dataStr).getTime() || 0;
    }

    // ==========================================
    // RENDERIZADOR 1: RESUMO SEMANAL EXECUTIVO
    // ==========================================
    function renderizarResumoSemanal() {
      const container = document.getElementById('news-container');
      container.className = "flex flex-col gap-5 col-span-full max-w-4xl mx-auto w-full";
      container.innerHTML = '';

      if (!bancoDados.resumosSemanais || bancoDados.resumosSemanais.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-gray-200 rounded-xl p-10 text-center">
            <span class="material-symbols-outlined text-4xl text-emerald-600 mb-2">auto_stories</span>
            <h2 class="text-gray-900 font-bold text-base mb-1">Briefing Executivo em Geração</h2>
            <p class="text-xs text-gray-500 max-w-md mx-auto">Nenhum resumo semanal consolidado foi encontrado no banco de dados no momento.</p>
          </div>
        `;
        return;
      }

      const resumosOrdenados = [...bancoDados.resumosSemanais].sort((a, b) => b.idSemana.localeCompare(a.idSemana));
      
      if (indexSemanaSelecionada >= resumosOrdenados.length) indexSemanaSelecionada = 0;
      if (indexSemanaSelecionada < 0) indexSemanaSelecionada = 0;

      const semana = resumosOrdenados[indexSemanaSelecionada];
      const temAnterior = indexSemanaSelecionada < resumosOrdenados.length - 1;
      const temProxima = indexSemanaSelecionada > 0;

      const statusTag = semana.status === "EM_ANDAMENTO" 
        ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-amber-50 text-amber-700 border border-amber-200"><span class="w-1 h-1 rounded-full bg-amber-500 animate-pulse"></span> Em andamento</span>`
        : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-1 h-1 rounded-full bg-emerald-600"></span> Concluída</span>`;

      let html = `
        <div class="flex items-center justify-between bg-white border border-gray-200 py-3 px-4 rounded-xl shadow-sm">
          <button onclick="mudarSemana(1)" ${!temAnterior ? 'disabled class="opacity-30 cursor-not-allowed flex items-center text-xs font-semibold text-gray-500"' : 'class="flex items-center text-xs font-semibold text-primary hover:underline"'}>
            <span class="material-symbols-outlined text-[16px] mr-1">arrow_back</span> Anterior
          </button>
          
          <div class="text-center flex flex-col items-center">
            <span class="text-sm font-extrabold text-gray-900 tracking-tight">${semana.rotuloVisual || semana.idSemana}</span>
            <span class="text-[10px] text-gray-400 font-medium mt-0.5">${semana.dataInicial} a ${semana.dataFinal}</span>
            <div class="mt-1.5">${statusTag}</div>
          </div>

          <button onclick="mudarSemana(-1)" ${!temProxima ? 'disabled class="opacity-30 cursor-not-allowed flex items-center text-xs font-semibold text-gray-500"' : 'class="flex items-center text-xs font-semibold text-primary hover:underline"'}>
            Próxima <span class="material-symbols-outlined text-[16px] ml-1">arrow_forward</span>
          </button>
        </div>

        <section class="bg-emerald-50/60 border border-emerald-100 p-5 rounded-xl shadow-sm">
          <div class="flex justify-between items-start mb-2">
            <h3 class="text-[11px] font-bold uppercase tracking-widest text-emerald-800 flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">timer</span> A semana em 30 segundos</h3>
            <button onclick="copiarResumo()" class="text-[10px] bg-white border border-emerald-200 text-emerald-700 px-2 py-1 rounded font-semibold hover:bg-emerald-100 transition-colors">Copiar Resumo</button>
          </div>
          <p class="text-sm leading-relaxed text-gray-800 font-medium">
            ${semana.resumoExecutivo || 'Resumo executivo temporariamente indisponível.'}
          </p>
        </section>
      `;

      window.semanaAtualCopy = { rotulo: semana.rotuloVisual, exe: semana.resumoExecutivo, destaques: semana.destaques };

      const catOrdem = ["Mercado", "Comercial", "Regulatório", "Ciência/Técnico", "Eventos"];
      const destaquesObj = semana.destaques || {};
      let encontrouAlgumDestaque = false;

      catOrdem.forEach(cat => {
        const lista = destaquesObj[cat] || [];
        if (lista.length > 0) {
          encontrouAlgumDestaque = true;
          const badge = getBadgeInfo(cat);

          html += `
            <section class="space-y-3 mt-2">
              <div class="flex items-center justify-between border-b border-gray-200 pb-2">
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-gray-700 text-[20px]">${badge.icn}</span>
                  <h3 class="text-sm font-bold text-gray-900 uppercase tracking-wider">${cat}</h3>
                </div>
                <span class="text-[11px] text-gray-400 font-medium">${lista.length} destaque(s)</span>
              </div>
              <div class="grid grid-cols-1 gap-4">
          `;

          lista.forEach(item => {
            const tagsHTML = (item.tags && item.tags.length > 0) 
              ? item.tags.map(t => `<span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] font-medium">#${t}</span>`).join(' ')
              : '';

            const badgeFontes = (item.fontesRelacionadas && item.fontesRelacionadas > 1)
              ? `<span class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full font-semibold">${item.fontesRelacionadas} fontes relacionadas</span>`
              : '';

            const boxPorqueImporta = (item.porqueImporta && typeof item.porqueImporta === 'string' && item.porqueImporta.trim().length > 10) ? `
              <div class="bg-emerald-50/80 border-l-4 border-primary p-3 rounded-r-xl mb-3">
                <span class="text-[11px] font-bold text-emerald-900 block mb-0.5 uppercase tracking-wide">Por que isso importa</span>
                <p class="text-xs text-emerald-950 leading-relaxed">${item.porqueImporta}</p>
              </div>
            ` : '';

            html += `
              <article class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
                <div class="flex justify-between items-start gap-2 mb-2">
                  <h4 class="text-sm font-bold text-gray-900 leading-snug">
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors">${item.titulo}</a>
                  </h4>
                  ${badgeFontes}
                </div>
                <p class="text-xs text-gray-700 leading-relaxed mb-3">${item.resumo}</p>
                ${boxPorqueImporta}
                <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-gray-100 text-xs">
                  <div class="flex items-center gap-1.5 text-gray-500 font-medium">
                    <span class="uppercase text-[10px] font-semibold">${item.fonte || 'Google News'}</span>
                    <span>•</span>
                    <span class="text-[10px]">${formatarDataVisual(item.data) || item.data}</span>
                  </div>
                  <div class="flex items-center gap-1">${tagsHTML}</div>
                </div>
              </article>
            `;
          });
          html += `</div></section>`;
        }
      });

      if (!encontrouAlgumDestaque) {
        html += `<div class="bg-white border border-gray-200 rounded-xl p-8 text-center text-gray-500 text-sm">Nenhum destaque categorizado disponível para este período semanal.</div>`;
      }

      container.innerHTML = html;
    }

    function copiarResumo() {
      if(!window.semanaAtualCopy) return;
      let txt = `🌾 SORGHUMINTEL | RESUMO SEMANAL\n${window.semanaAtualCopy.rotulo}\n\n📌 A SEMANA EM 30 SEGUNDOS\n${window.semanaAtualCopy.exe}\n\n`;
      for(const k in window.semanaAtualCopy.destaques) {
        if(window.semanaAtualCopy.destaques[k].length > 0){
          txt += `📊 ${k.toUpperCase()}\n`;
          window.semanaAtualCopy.destaques[k].forEach(d => { 
            const pi = d.porqueImporta ? `\n  → ${d.porqueImporta}` : "";
            txt += `• ${d.titulo}${pi}\n\n`; 
          });
        }
      }
      txt += "Fonte: SorghumIntel";
      navigator.clipboard.writeText(txt).then(() => alert("Resumo copiado para a área de transferência!"));
    }

    function mudarSemana(delta) {
      indexSemanaSelecionada += delta;
      renderizarResumoSemanal();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==========================================
    // RENDERIZADOR 2: FEED DE NOTÍCIAS / EVENTOS
    // ==========================================
    function renderizarCards(itens) {
      const container = document.getElementById('news-container');
      container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 col-span-full";
      container.innerHTML = ''; 
      
      if (!itens || itens.length === 0) {
        container.innerHTML = '<p class="text-center w-full text-gray-500 col-span-full pt-8">Nenhuma inteligência encontrada nesta categoria.</p>';
        return;
      }

      const ordenados = [...itens].sort((a, b) => parseDataParaTimestamp(b.data) - parseDataParaTimestamp(a.data));

      ordenados.forEach((item) => {
        const badge = getBadgeInfo(item.categoria);
        const dataExibicao = formatarDataVisual(item.data) || item.data || '';

        const tagsHTML = (item.tags && item.tags.length > 0) 
          ? item.tags.map(t => `<span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded text-[10px] font-medium">#${t}</span>`).join(' ')
          : '';

        const boxPorqueImporta = (item.porqueImporta && typeof item.porqueImporta === 'string' && item.porqueImporta.trim().length > 10) ? `
          <div class="bg-gray-50 border-l-2 border-primary p-2.5 rounded-r-lg mb-4 text-xs text-gray-700">
            <strong class="text-emerald-900 block text-[11px] uppercase tracking-wider mb-0.5">Impacto Prático:</strong>
            ${item.porqueImporta}
          </div>
        ` : '';

        container.innerHTML += `
          <article class="bg-white border border-outline-variant rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between h-full">
            <div>
              <div class="flex justify-between items-center mb-4">
                <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${badge.cls}">${badge.tag}</span>
                <div class="flex items-center gap-1.5 text-gray-500 text-xs font-semibold">
                  <span class="material-symbols-outlined text-[16px] text-gray-400">calendar_today</span>
                  <span>${dataExibicao}</span>
                </div>
              </div>
              <h2 class="text-base font-bold text-gray-900 mb-2 leading-snug hover:text-primary transition-colors">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.titulo}</a>
              </h2>
              <div class="text-xs text-gray-500 font-semibold mb-3 flex items-center gap-1.5 uppercase">
                <span class="material-symbols-outlined text-[16px] text-gray-400">${badge.icn}</span>
                FONTE: ${item.fonte || 'Google News'}
              </div>
              <p class="text-gray-700 text-sm leading-relaxed mb-3">${item.resumo}</p>
              ${boxPorqueImporta}
            </div>
            <div>
              <div class="flex flex-wrap gap-1 mb-3">${tagsHTML}</div>
              <div class="pt-3 border-t border-outline-variant flex justify-start items-center text-xs font-bold">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="text-primary hover:underline flex items-center gap-1">
                  Acessar fonte original &rarr;
                </a>
              </div>
            </div>
          </article>
        `;
      });
    }

    // ==========================================
    // RENDERIZADOR 3: MONITOR DE COTAÇÕES
    // ==========================================
    function renderizarTabelaPrecos(precos) {
      const container = document.getElementById('news-container');
      container.className = "flex flex-col gap-6 col-span-full max-w-5xl mx-auto w-full";
      container.innerHTML = '';

      if (!precos || precos.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-outline-variant rounded-2xl p-8 text-center shadow-sm">
            <span class="material-symbols-outlined text-4xl text-emerald-600 mb-2">payments</span>
            <p class="text-gray-800 font-bold text-base mb-1">Monitor de cotações</p>
            <p class="text-xs text-gray-500 max-w-md mx-auto">Nenhuma cotação verificável foi encontrada no momento.</p>
          </div>
        `;
        return;
      }

      let htmlPrecos = `
        <div class="bg-white border border-outline-variant rounded-2xl p-6 shadow-sm">
          <div class="flex flex-col md:flex-row justify-between md:items-center gap-2 mb-6 border-b border-gray-100 pb-4">
            <div>
              <h2 class="text-lg font-bold text-gray-900">Monitor de cotações</h2>
              <p class="text-xs text-gray-500">Apresenta apenas cotações com fonte auditável e relação real observada em datas compatíveis (saca 60kg disponível)</p>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-600"></span> Cotação Verificada
              </span>
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-gray-50 text-gray-600 border border-gray-200 font-medium">
                <span class="w-2 h-2 rounded-full bg-gray-400"></span> Sem cotação disponível
              </span>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b border-gray-200 text-xs font-bold text-gray-500 uppercase tracking-wider">
                  <th class="pb-3 px-4">Praça / Polo</th>
                  <th class="pb-3 px-4 text-right">Sorgo (R$/sc 60kg)</th>
                  <th class="pb-3 px-4 text-right">Milho (R$/sc 60kg)</th>
                  <th class="pb-3 px-4 text-center">Relação Observada</th>
                  <th class="pb-3 px-4">Fonte dos Dados</th>
                  <th class="pb-3 px-4 text-right">Data Cotação</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100 font-medium">
      `;

      precos.forEach(p => {
        let sorgoHTML = `<span class="text-xs text-gray-400 italic">Sem cotação verificada disponível</span>`;
        if (p.precoSorgo && p.precoSorgo !== "null") {
          const precoFormatado = formatarMoedaBR(p.precoSorgo);
          let tagDefasagem = "";
          if (p.statusAtualidadeSorgo === "ATENCAO_DEFASAGEM") tagDefasagem = `<span class="block text-[10px] text-amber-600 font-normal">Atualizado há ${p.diasDesdeAtualizacaoSorgo} dias</span>`;
          else if (p.statusAtualidadeSorgo === "COTACAO_DESATUALIZADA") tagDefasagem = `<span class="block text-[10px] text-red-500 font-normal">Desatualizado</span>`;
          sorgoHTML = `<span class="text-primary font-bold text-base">${precoFormatado}</span>${tagDefasagem}`;
        }

        let milhoHTML = `<span class="text-xs text-gray-400 italic">Sem cotação</span>`;
        if (p.precoMilho && p.precoMilho !== "null") {
          milhoHTML = `<span class="text-gray-700 font-semibold text-base">${formatarMoedaBR(p.precoMilho)}</span>`;
        }

        let relacaoHTML = `<span class="text-xs text-gray-400" title="Exige cotações verificadas na mesma data">—</span>`;
        if (p.relacaoMilho && p.relacaoMilho !== "null") {
          relacaoHTML = `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">${String(p.relacaoMilho).replace('.', ',')}%</span>`;
        }

        let fonteHTML = `<span class="text-xs text-gray-400 italic">Aguardando integração</span>`;
        const fExibir = p.fonteSorgo || p.fonte || p.fonteMilho;
        const uExibir = p.urlFonteSorgo || p.urlFonte || p.urlFonteMilho;
        if (fExibir) {
          if (uExibir) fonteHTML = `<a href="${uExibir}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-gray-700 hover:text-primary hover:underline bg-gray-50 px-2 py-1 rounded border border-gray-200">${fExibir} <span class="material-symbols-outlined text-[13px]">open_in_new</span></a>`;
          else fonteHTML = `<span class="text-xs font-semibold text-gray-600 bg-gray-50 px-2 py-1 rounded border border-gray-200">${fExibir}</span>`;
        }

        const dataAtualizacao = (p.dataSorgo || p.data || p.dataMilho) ? formatarDataVisual(p.dataSorgo || p.data || p.dataMilho) : `<span class="text-xs text-gray-400 italic">Não identificada</span>`;

        htmlPrecos += `
          <tr class="hover:bg-gray-50/80 transition-colors">
            <td class="py-4 px-4 font-bold text-gray-900 flex items-center gap-2">
              <span class="material-symbols-outlined text-gray-400 text-base">location_on</span>
              ${p.praca} <span class="text-xs text-gray-400 font-normal">(${p.uf || '-'})</span>
            </td>
            <td class="py-4 px-4 text-right">${sorgoHTML}</td>
            <td class="py-4 px-4 text-right">${milhoHTML}</td>
            <td class="py-4 px-4 text-center">${relacaoHTML}</td>
            <td class="py-4 px-4">${fonteHTML}</td>
            <td class="py-4 px-4 text-right text-xs text-gray-500">${dataAtualizacao}</td>
          </tr>
        `;
      });
      htmlPrecos += `</tbody></table></div></div>`;
      container.innerHTML = htmlPrecos;
    }

    // ==========================================
    // NAVEGAÇÃO E EVENTOS
    // ==========================================
    function configurarBotoes() {
      const botoes = document.querySelectorAll('#nav-buttons button');
      botoes.forEach(botao => {
        botao.addEventListener('click', () => {
          const tab = botao.getAttribute('data-tab');
          aplicarFiltro(tab);
        });
      });
    }

    async function aplicarFiltro(tab) {
      abaAtual = tab;
      const inputBusca = document.getElementById('search-input');
      const termo = inputBusca ? inputBusca.value.toLowerCase().trim() : "";

      // Atualiza visual dos botões
      document.querySelectorAll('#nav-buttons button').forEach(b => {
        b.className = "px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap";
        if (b.getAttribute('data-tab') === tab) {
          if (tab === "ResumoSemanal") {
            b.className = "px-4 py-2 bg-primary text-white font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1.5 shadow-sm active-tab";
          } else if (tab === "Cotacao") {
            b.className = "px-4 py-2 bg-emerald-600 text-white font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1 shadow-sm";
          } else {
            b.className = "px-4 py-2 bg-primary text-white font-bold rounded-full text-sm whitespace-nowrap shadow-sm";
          }
        }
      });

      if (tab === "ResumoSemanal") {
        renderizarResumoSemanal();
        return;
      }

      if (tab === "Cotacao") {
        if (!bancoDados.precos || bancoDados.precos.length === 0) {
          document.getElementById('news-container').innerHTML = '<p class="text-center w-full py-8 text-gray-500 col-span-full">Consultando cotações verificadas...</p>';
          await carregarDadosIniciais();
        }
        renderizarTabelaPrecos(bancoDados.precos);
        return;
      }

      let listaOrigem = [];
      if (tab === "Eventos") {
        const mapUnicos = new Map();
        (bancoDados.eventos || []).forEach(e => mapUnicos.set(e.url || e.titulo, { ...e, categoria: "Eventos" }));
        (bancoDados.noticias || []).forEach(n => {
          const c = (n.categoria || "").toLowerCase();
          const t = (n.titulo || "").toLowerCase();
          if (c.includes("evento") || c.includes("campo") || t.includes("dia de campo") || t.includes("congresso") || t.includes("seminário") || t.includes("encontro")) {
            mapUnicos.set(n.url || n.titulo, { ...n, categoria: "Eventos" });
          }
        });
        listaOrigem = Array.from(mapUnicos.values());
      } else if (tab === "Tudo") {
        listaOrigem = [...(bancoDados.noticias || []), ...(bancoDados.eventos || [])];
      } else {
        const trm = tab.toLowerCase().split('/')[0].trim();
        listaOrigem = (bancoDados.noticias || []).filter(n => (n.categoria || "").toLowerCase().includes(trm));
      }

      if (termo) {
        listaOrigem = listaOrigem.filter(n => 
          (n.titulo && n.titulo.toLowerCase().includes(termo)) || 
          (n.resumo && n.resumo.toLowerCase().includes(termo)) ||
          (n.porqueImporta && n.porqueImporta.toLowerCase().includes(termo)) ||
          (n.fonte && n.fonte.toLowerCase().includes(termo))
        );
      }

      renderizarCards(listaOrigem);
    }

    async function carregarDadosIniciais(forcarAtualizacao = false) {
      const banner = document.getElementById('offline-banner');
      const syncTxt = document.getElementById('sync-info');
      try {
        const resposta = await fetch(`${API_URL}?_t=${Date.now()}`);
        if (!resposta.ok) throw new Error("Erro na rede HTTP " + resposta.status);
        const dados = await resposta.json();

        if (dados && typeof dados === 'object') {
          bancoDados.noticias = dados.noticias || [];
          bancoDados.eventos = dados.eventos || [];
          bancoDados.precos = dados.precos || [];
          bancoDados.resumosSemanais = dados.resumosSemanais || [];
          
          const hrStr = new Date().toLocaleString('pt-BR');
          localStorage.setItem("sorghumintel_last_valid_data", JSON.stringify(bancoDados));
          localStorage.setItem("sorghumintel_last_valid_sync", hrStr);
          syncTxt.innerText = `Sincronizado: ${hrStr}`;
          banner.classList.add('hidden');
        }
      } catch (erro) {
        console.warn("Erro ao buscar API, tentando cache local:", erro);
        const cacheRaw = localStorage.getItem("sorghumintel_last_valid_data");
        const cacheSync = localStorage.getItem("sorghumintel_last_valid_sync");
        if (cacheRaw) {
          bancoDados = JSON.parse(cacheRaw);
          syncTxt.innerText = `Sincronizado: ${cacheSync}`;
          document.getElementById('offline-text').innerText = `Exibindo última sincronização disponível — ${cacheSync}`;
          banner.classList.remove('hidden');
        } else {
          document.getElementById('news-container').innerHTML = '<p class="text-center w-full col-span-full pt-8 text-red-600 font-bold">Não foi possível carregar os dados no momento.</p>';
          return;
        }
      }
      
      if (forcarAtualizacao) {
        aplicarFiltro(abaAtual);
      }
    }

    // Bind inputs and load
    document.getElementById('search-input').addEventListener('input', () => {
      if (abaAtual !== "ResumoSemanal" && abaAtual !== "Cotacao") {
        aplicarFiltro(abaAtual);
      }
    });

    window.onload = async () => {
      const c = document.getElementById('news-container');
      c.innerHTML = '<p class="text-center w-full col-span-full pt-8 text-gray-500">Sintetizando inteligência executiva de mercado...</p>';
      
      configurarBotoes();
      await carregarDadosIniciais();
      aplicarFiltro("ResumoSemanal");
    };
  </script>
</body>

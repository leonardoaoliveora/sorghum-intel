<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SorghumIntel - Inteligência de Mercado</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#0d631b", background: "#f4faff", "outline-variant": "#bfcaba" },
          fontFamily: { "body-md": ["Inter"] }
        }
      }
    }
  </script>
  <style> body { background-color: #f4faff; -webkit-font-smoothing: antialiased; } .no-scrollbar::-webkit-scrollbar { display: none; } </style>
</head>
<body class="font-body-md bg-background pb-24 md:pb-0 pt-16">

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white border-b border-outline-variant shadow-sm">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-2xl">agriculture</span>
      <h1 class="text-xl font-bold text-primary tracking-tight">SorghumIntel</h1>
    </div>
    <div class="flex flex-col items-end">
      <button onclick="carregarDadosIniciais(true)" class="material-symbols-outlined text-primary hover:bg-emerald-50 rounded-full transition-colors" title="Forçar Atualização">refresh</button>
      <span id="sync-info" class="text-[9px] text-gray-400 font-semibold mt-0.5"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Banner de Erro/Offline -->
    <div id="offline-banner" class="hidden mb-4 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-base">cloud_off</span> 
      <span id="offline-text">Exibindo última sincronização disponível.</span>
    </div>

    <!-- Barra de Busca -->
    <div class="mb-6 relative">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">search</span>
      <input id="search-input" class="w-full pl-12 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:outline-none focus:border-primary shadow-sm text-sm" placeholder="Buscar no SorghumIntel..." type="text">
    </div>

    <!-- Navegação -->
    <div class="overflow-x-auto no-scrollbar mb-8">
      <div class="flex space-x-2" id="nav-buttons">
        <button data-tab="ResumoSemanal" class="px-4 py-2 bg-primary text-white font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1.5 shadow-sm active-tab"><span class="material-symbols-outlined text-[18px]">auto_stories</span> Resumo Semanal</button>
        <button data-tab="Tudo" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Tudo</button>
        <button data-tab="Regulatório" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Regulatório</button>
        <button data-tab="Ciência/Técnico" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Ciência/Técnico</button>
        <button data-tab="Mercado" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Mercado</button>
        <button data-tab="Comercial" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Comercial</button>
        <button data-tab="Eventos" class="px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap">Eventos</button>
        <button data-tab="Cotacao" class="px-4 py-2 bg-white border border-emerald-600 text-emerald-800 font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">payments</span> Cotação</button>
      </div>
    </div>

    <!-- Container -->
    <div id="main-content-container"><div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div></div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz-xQ31zO2zy5slgOlp-fWrWBw47xjwu017Oh9YLMjxQ18bilqjCOdOcWMEoE7shFoEhg/exec";
    let bancoDados = { noticias: [], eventos: [], precos: [], resumosSemanais: [] };
    let abaAtual = "ResumoSemanal", indexSemanaSelecionada = 0;

    function getBadgeInfo(cat) {
      if(!cat) return { cls: "bg-gray-700 text-white", icn: "article", tag: "Geral" };
      const c = cat.toLowerCase();
      if (c.includes("regulat")) return { cls: "bg-slate-700 text-white", icn: "policy", tag: "Regulatório" };
      if (c.includes("ciência") || c.includes("tecnico")) return { cls: "bg-sky-700 text-white", icn: "biotech", tag: "Ciência/Técnico" };
      if (c.includes("mercado")) return { cls: "bg-emerald-800 text-white", icn: "monitoring", tag: "Mercado" };
      if (c.includes("comercial")) return { cls: "bg-indigo-700 text-white", icn: "domain", tag: "Comercial" };
      if (c.includes("evento")) return { cls: "bg-emerald-600 text-white", icn: "event", tag: "Eventos" };
      return { cls: "bg-gray-700 text-white", icn: "article", tag: "Geral" };
    }

    function renderizarResumoSemanal() {
      const container = document.getElementById('news-container');
      container.className = "flex flex-col gap-5 col-span-full max-w-4xl mx-auto w-full";
      container.innerHTML = '';

      if (!bancoDados.resumosSemanais || bancoDados.resumosSemanais.length === 0) {
        container.innerHTML = `<div class="bg-white border rounded-xl p-10 text-center"><p class="text-sm text-gray-500">Resumo executivo temporariamente indisponível.</p></div>`;
        return;
      }

      const resumosOrdenados = [...bancoDados.resumosSemanais].sort((a, b) => b.idSemana.localeCompare(a.idSemana));
      if (indexSemanaSelecionada >= resumosOrdenados.length) indexSemanaSelecionada = 0;
      
      const semana = resumosOrdenados[indexSemanaSelecionada];
      const temAnterior = indexSemanaSelecionada < resumosOrdenados.length - 1;
      const temProxima = indexSemanaSelecionada > 0;

      let html = `
        <div class="flex items-center justify-between bg-white border border-gray-200 py-3 px-4 rounded-xl">
          <button onclick="mudarSemana(1)" ${!temAnterior ? 'disabled class="opacity-30"' : ''} class="text-xs font-semibold text-primary hover:underline">Anterior</button>
          <div class="text-center">
            <span class="text-sm font-extrabold text-gray-900">${semana.rotuloVisual || semana.idSemana}</span>
          </div>
          <button onclick="mudarSemana(-1)" ${!temProxima ? 'disabled class="opacity-30"' : ''} class="text-xs font-semibold text-primary hover:underline">Próxima</button>
        </div>

        <section class="bg-emerald-50/60 border border-emerald-100 p-5 rounded-xl">
          <div class="flex justify-between items-start mb-2">
            <h3 class="text-[11px] font-bold uppercase tracking-widest text-emerald-800 flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">timer</span> A semana em 30 segundos</h3>
            <button onclick="copiarResumo()" class="text-[10px] bg-white border border-emerald-200 text-emerald-700 px-2 py-1 rounded font-semibold hover:bg-emerald-100 transition-colors">Copiar Resumo</button>
          </div>
          <p class="text-sm leading-relaxed text-gray-800 font-medium" id="txt-resumo-exec">${semana.resumoExecutivo}</p>
        </section>
      `;

      // Armazena dados no window para o botão Copiar
      window.semanaAtualCopy = { rotulo: semana.rotuloVisual, exe: semana.resumoExecutivo, destaques: semana.destaques };

      const catOrdem = ["Mercado", "Comercial", "Regulatório", "Ciência/Técnico", "Eventos"];
      catOrdem.forEach(cat => {
        const lista = semana.destaques[cat] || [];
        if (lista.length > 0) {
          html += `<section class="space-y-3 mt-2"><h3 class="text-sm font-bold text-gray-900 border-b pb-1 uppercase">${cat}</h3><div class="grid grid-cols-1 gap-4">`;
          lista.forEach(item => {
            const pi = item.porqueImporta ? `<div class="bg-emerald-50/80 border-l-4 border-primary p-3 rounded-r-xl mt-2"><span class="text-[11px] font-bold text-emerald-900 block mb-0.5 uppercase tracking-wide">Por que isso importa</span><p class="text-xs text-emerald-950">${item.porqueImporta}</p></div>` : '';
            html += `
              <article class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h4 class="text-sm font-bold text-gray-900 mb-1"><a href="${item.url}" target="_blank" class="hover:text-primary">${item.titulo}</a></h4>
                <p class="text-xs text-gray-700">${item.resumo}</p>
                ${pi}
              </article>`;
          });
          html += `</div></section>`;
        }
      });
      container.innerHTML = html;
    }

    function copiarResumo() {
      if(!window.semanaAtualCopy) return;
      let txt = `🌾 SORGHUMINTEL | RESUMO SEMANAL\n${window.semanaAtualCopy.rotulo}\n\n📌 A SEMANA EM 30 SEGUNDOS\n${window.semanaAtualCopy.exe}\n\n`;
      for(const k in window.semanaAtualCopy.destaques) {
        if(window.semanaAtualCopy.destaques[k].length > 0){
          txt += `📊 ${k.toUpperCase()}\n`;
          window.semanaAtualCopy.destaques[k].forEach(d => { txt += `• ${d.titulo}\n  → ${d.porqueImporta||d.resumo}\n\n`; });
        }
      }
      txt += "Fonte: SorghumIntel";
      navigator.clipboard.writeText(txt).then(() => alert("Resumo copiado para a área de transferência!"));
    }

    function mudarSemana(delta) { indexSemanaSelecionada += delta; renderizarResumoSemanal(); }

    function renderizarCards(itens) {
      const container = document.getElementById('news-container');
      container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
      container.innerHTML = ''; 
      if (!itens || itens.length===0) { container.innerHTML='<p class="text-center w-full text-gray-500 col-span-full pt-8">Sem resultados.</p>'; return; }

      itens.forEach(item => {
        const badge = getBadgeInfo(item.categoria);
        const pi = item.porqueImporta ? `<div class="bg-gray-50 border-l-2 border-primary p-2 mt-2 rounded-r-lg text-xs text-gray-700"><strong class="block text-[10px] uppercase text-emerald-900">Impacto:</strong>${item.porqueImporta}</div>` : '';
        container.innerHTML += `
          <article class="bg-white border rounded-xl p-5 shadow-sm hover:shadow-md flex flex-col justify-between">
            <div>
              <div class="mb-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${badge.cls}">${badge.tag}</span></div>
              <h2 class="text-sm font-bold text-gray-900 mb-1"><a href="${item.url}" target="_blank">${item.titulo}</a></h2>
              <p class="text-xs text-gray-700">${item.resumo}</p>
              ${pi}
            </div>
          </article>`;
      });
    }

    function renderizarTabelaPrecos(precos) {
      const c = document.getElementById('news-container');
      c.className = "flex flex-col gap-6 col-span-full max-w-5xl mx-auto w-full";
      if (!precos || precos.length === 0) { c.innerHTML = `<p class="text-center pt-8">Sem cotações.</p>`; return; }

      let h = `<div class="bg-white border rounded-xl p-6 shadow-sm"><div class="overflow-x-auto"><table class="w-full text-left text-sm">
        <thead><tr class="border-b text-xs text-gray-500 uppercase"><th class="pb-2">Polo</th><th class="pb-2 text-right">Sorgo</th><th class="pb-2 text-right">Milho</th><th class="pb-2 text-center">Relação</th><th class="pb-2">Fonte</th><th class="pb-2 text-right">Data</th></tr></thead><tbody>`;
      
      precos.forEach(p => {
        const sr = p.precoSorgo ? `<strong class="text-primary">${formatarMoedaBR(p.precoSorgo)}</strong>` : `<i class="text-xs text-gray-400">Sem cotação</i>`;
        const mr = p.precoMilho ? `<strong>${formatarMoedaBR(p.precoMilho)}</strong>` : `<i class="text-xs text-gray-400">Sem cotação</i>`;
        const rel = p.relacaoMilho ? `<span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full text-xs font-bold">${String(p.relacaoMilho).replace('.',',')}%</span>` : `-`;
        
        let fSorgoHtml = p.fonteSorgo ? (p.urlFonteSorgo ? `<a href="${p.urlFonteSorgo}" target="_blank" class="block text-[10px] text-gray-500 hover:text-primary">Sorgo: ${p.fonteSorgo}</a>` : `<span class="block text-[10px] text-gray-500">Sorgo: ${p.fonteSorgo}</span>`) : "";
        let fMilhoHtml = p.fonteMilho ? (p.urlFonteMilho ? `<a href="${p.urlFonteMilho}" target="_blank" class="block text-[10px] text-gray-500 hover:text-primary">Milho: ${p.fonteMilho}</a>` : `<span class="block text-[10px] text-gray-500">Milho: ${p.fonteMilho}</span>`) : "";
        let dSorgoHtml = p.dataSorgo ? `<span class="block text-[10px] text-gray-500">S: ${p.dataSorgo}</span>` : "";
        let dMilhoHtml = p.dataMilho ? `<span class="block text-[10px] text-gray-500">M: ${p.dataMilho}</span>` : "";

        h += `<tr class="border-b border-gray-50 hover:bg-gray-50">
          <td class="py-3 font-bold">${p.praca} <span class="font-normal text-xs text-gray-400">(${p.uf})</span></td>
          <td class="py-3 text-right">${sr}</td><td class="py-3 text-right">${mr}</td><td class="py-3 text-center">${rel}</td>
          <td class="py-3">${fSorgoHtml}${fMilhoHtml}</td><td class="py-3 text-right">${dSorgoHtml}${dMilhoHtml}</td>
        </tr>`;
      });
      c.innerHTML = h + `</tbody></table></div></div>`;
    }

    function aplicarFiltro(tab) {
      abaAtual = tab;
      const t = document.getElementById('search-input')?.value.toLowerCase().trim() || "";
      document.querySelectorAll('#nav-buttons button').forEach(b => {
        b.className = "px-4 py-2 bg-white border border-outline-variant text-gray-600 rounded-full text-sm whitespace-nowrap";
        if(b.getAttribute('data-tab')===tab) b.className = "px-4 py-2 bg-primary text-white font-bold rounded-full text-sm whitespace-nowrap flex items-center gap-1.5 shadow-sm";
      });

      if (tab === "ResumoSemanal") return renderizarResumoSemanal();
      if (tab === "Cotacao") return renderizarTabelaPrecos(bancoDados.precos);

      let org = (tab==="Tudo") ? [...bancoDados.noticias, ...bancoDados.eventos] : bancoDados.noticias.filter(n => (n.categoria||"").toLowerCase().includes(tab.toLowerCase()));
      if (t) org = org.filter(n => (n.titulo&&n.titulo.toLowerCase().includes(t)) || (n.resumo&&n.resumo.toLowerCase().includes(t)));
      renderizarCards(org);
    }

    async function carregarDadosIniciais(forcar = false) {
      const banner = document.getElementById('offline-banner');
      const syncTxt = document.getElementById('sync-info');
      try {
        const res = await fetch(`${API_URL}?_t=${Date.now()}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const d = await res.json();
        if (d && d.precos) {
          bancoDados = d;
          const dt = new Date().toLocaleString('pt-BR');
          localStorage.setItem("sorghum_db", JSON.stringify(d));
          localStorage.setItem("sorghum_dt", dt);
          syncTxt.innerText = `Sincronizado: ${dt}`;
          banner.classList.add('hidden');
        } else throw new Error("Payload inválido");
      } catch (e) {
        const c = localStorage.getItem("sorghum_db");
        if (c) {
          bancoDados = JSON.parse(c);
          const dt = localStorage.getItem("sorghum_dt") || "Desconhecida";
          syncTxt.innerText = `Sincronizado: ${dt}`;
          document.getElementById('offline-text').innerText = `Exibindo última sincronização disponível — ${dt}`;
          banner.classList.remove('hidden');
        } else {
          document.getElementById('news-container').innerHTML = '<p class="text-center pt-8 text-red-600 font-bold">Não foi possível carregar os dados no momento.</p>';
          return;
        }
      }
      if (forcar) aplicarFiltro(abaAtual);
    }

    document.getElementById('search-input').addEventListener('input', () => { if(abaAtual!=="ResumoSemanal" && abaAtual!=="Cotacao") aplicarFiltro(abaAtual); });
    window.onload = async () => { await carregarDadosIniciais(); aplicarFiltro("ResumoSemanal"); };
  </script>
</body>
</html>
